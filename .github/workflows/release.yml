name: Release

# Push a tag like v1.0.0 and this builds, packages and publishes a GitHub release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Publish tray app
        run: >
          dotnet publish ShakeCursor.csproj -c Release -r win-x64 --self-contained true
          -p:SkipSettingsBuild=true -p:Version=${{ steps.version.outputs.value }}
          -o artifacts/ShakeCursor

      - name: Publish settings app
        run: >
          dotnet publish Settings/ShakeCursor.Settings.csproj -c Release -r win-x64
          -p:Platform=x64 --self-contained true -p:WindowsAppSDKSelfContained=true
          -p:Version=${{ steps.version.outputs.value }}
          -o artifacts/ShakeCursor/Settings

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      # Pulls earlier releases so vpk can build small delta updates. The first
      # Velopack release has nothing to download, which is fine.
      - name: Download previous releases
        shell: pwsh
        run: |
          vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
          if ($LASTEXITCODE -ne 0) { Write-Host "No previous Velopack release found."; $global:LASTEXITCODE = 0 }

      - name: Pack installer and update packages
        run: >
          vpk pack --packId ShakeCursor --packTitle ShakeCursor
          --packVersion ${{ steps.version.outputs.value }}
          --packDir artifacts/ShakeCursor --mainExe ShakeCursor.exe
          --icon Assets/ShakeCursor.ico --shortcuts StartMenuRoot

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          vpk upload github --repoUrl https://github.com/${{ github.repository }} `
            --token $env:GH_TOKEN --publish `
            --releaseName "ShakeCursor ${{ github.ref_name }}" --tag ${{ github.ref_name }}

          # Checksums for the files people download by hand.
          Push-Location Releases
          $files = Get-ChildItem "ShakeCursor-win-Setup.exe", "ShakeCursor-win-Portable.zip" -ErrorAction SilentlyContinue
          foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)" | Out-File "$($f.Name).sha256" -Encoding ascii
          }
          Pop-Location
          gh release upload "${{ github.ref_name }}" (Get-ChildItem Releases/*.sha256).FullName --clobber

          # Install instructions first, then GitHub's generated "what changed" list.
          $install = "Run **ShakeCursor-win-Setup.exe** to install (Windows 10 1809 or later, x64, no runtime needed). Installed copies update themselves. A portable zip is also attached; it does not auto-update. The build is unsigned, so Windows SmartScreen may warn on first run."
          $changes = gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="${{ github.ref_name }}" --jq .body
          Set-Content -Path release-notes.md -Value "$install`n`n$changes" -Encoding utf8
          gh release edit "${{ github.ref_name }}" --notes-file release-notes.md
